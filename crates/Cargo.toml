[workspace]
resolver = "3"
# Only crates reachable from the public native TUI, its launcher, and the
# bundled cron sidecar belong to this workspace. Target-specific path
# dependencies are listed even when they are not compiled on the host running
# Cargo so that every supported platform has a closed source graph.
members = [
    "acosmi-config",
    "acosmi-cron-ledger",
    "acosmi-daemon-launcher",
    "acosmi-exec",
    "acosmi-executor",
    "acosmi-generation-lease",
    "acosmi-heartbeat",
    "acosmi-index",
    "acosmi-permission",
    "acosmi-sandbox",
    "acosmi-scheduler",
    "acosmi-shell-parser",
    "acosmi-supervisor",
    "acosmi-types",
    "acosmi-util-absolute-path",
    "crabcode-cli",
    "crabcode-cron",
    "crabcode-markdown-core",
    "crabcode-markdown",
    "crabcode-mermaid",
    "crabcode-pager-render",
    "crabcode-ratatui-inline",
    "crabcode-ratatui-textarea",
    "crabcode-tui",
]
[workspace.package]
version = "1.0.37"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/acosmi/CrabCode-TUI"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1.49", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 错误处理
thiserror = "2.0"
anyhow = "1.0"

# 日志与追踪
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 跨平台进程管理
kill_tree = "0.2"

# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"

# 配置
toml = "0.8"

# 终端 UI
colored = "3.1"
console = "0.16"
indicatif = "0.18"
dialoguer = "0.11"
anstyle = "=1.0.13"
anstyle-lossy = "=1.1.4"
anstyle-parse = "0.2.7"
anstyle-syntect = "=1.0.4"
ansi-width = "0.1"
crossterm = "0.28.1"
ratatui = "0.29.0"
textwrap = "0.16.2"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.0"
urlencoding = "2"
signal-hook = "0.3.18"
portable-pty = "0.9"
pulldown-cmark = "=0.13.0"
supports-color = "=3.0.2"
syntect = "=5.3.0"
two-face = { version = "=0.4.5", default-features = false, features = ["syntect-fancy"] }
html-escape = "=0.2.13"
fontdb = "=0.23.0"
resvg = { version = "=0.47.0", default-features = false, features = ["text"] }
tiny-skia = "=0.12.0"
wait-timeout = "=0.2.1"
mermaid-to-svg = { path = "../third_party/mermaid-to-svg" }

# 类型
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
url = { version = "2.5", features = ["serde"] }
regex = "1.11"
linkify = "0.10"
dirs = "6.0"
which = "7.0"
dotenvy = "0.15"

# Async 工具
futures = "0.3"
async-trait = "0.1"

# 平台特定（沙箱）
landlock = "0.4"
libseccomp = "0.4"
nix = { version = "0.29", features = ["sched", "signal", "mount", "user", "process"] }
libc = "0.2"
windows = { version = "0.62" }

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# WebSocket
# Keep the workspace default at handshake-only. The retained remote gateway
# client opts into connect + TLS explicitly in its own manifest.
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

# 配置加载
figment = { version = "0.10", features = ["toml", "json", "env"] }
json5 = "0.4"

# 哈希
sha2 = "0.10"

# 编辑/差异
similar = "2.7"
globset = "0.4"

# 系统信息
sysinfo = "0.33"

# 基准测试
criterion = { version = "0.5", features = ["html_reports"] }
colored_json = "5"
lipsum = "0.9"

# 测试
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"
serial_test = "3"
pretty_assertions = "1.4.1"
rand = "0.9"
termwiz = { version = "0.23", default-features = false }

# Codex fork-rename 衍生依赖（pin 与 codex 5a79dfa 对齐）
dunce = "1.0.4"
schemars = "0.8.22"
ts-rs = "11"
regex-lite = "0.1.8"
lru = "0.16.3"
sha1 = "0.10.6"
base64 = "0.22.1"
blake3 = "1"
image = { version = "0.25.9", default-features = false }
arboard = "3.6"
indexmap = "2"
mime_guess = "2.0.5"
multimap = "0.10.0"
shlex = "1.3.0"
starlark = "0.13.0"

# Codex fork-rename 额外依赖（protocol 专属）
chardetng = "0.1.17"
encoding_rs = "0.8.35"
http = "1.3.1"
icu_decimal = "2.1"
icu_locale_core = "2.1"
icu_provider = { version = "2.1", features = ["sync"] }
quick-xml = "0.38.4"
seccompiler = "0.5.0"
serde_with = "3.17"
strum = "0.27.2"
strum_macros = "0.28.0"
sys-locale = "0.3.2"
wildmatch = "2.6.1"

# Codex fork-rename 额外依赖（shell-command / protocol utilities）
once_cell = "1.20.2"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25"
rmcp = { version = "0.15.0", default-features = false }
inventory = "0.3.19"

[patch.crates-io]
# Crossterm 0.28.1 otherwise retains an unterminated bracketed-paste payload
# without a byte ceiling and spins on Unix PTY EOF. The vendored source is the
# exact locked crate plus the bounded parser/EOF fixes covered by its local
# tests; keep the upstream license and provenance files with the source.
crossterm = { path = "../third_party/crossterm-0.28.1-patched" }
# Ratatui 0.29.0 truncated flat buffer indices to u16 before converting them
# back to coordinates. Terminals with more than 65,535 cells therefore emitted
# diffs at the wrong coordinates. This is the exact locked crate with that
# conversion fixed and a >u16::MAX regression test; its upstream license and
# provenance files remain next to the vendored source.
ratatui = { path = "../third_party/ratatui-0.29.0-patched" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
# CI 走 `cargo clippy --workspace --all-targets -- -D warnings`（rust.yml:21,40），
# 任何 warn 都会升 error。clippy 官方文档把 pedantic/nursery 标 "may have false
# positives" 与 "still under development"，不适合长期作 deny；expect_used 在
# restriction 组，亦非默认 enable。这里只锁 unwrap_used = deny 一条 panic 红线。
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
unwrap_used = "deny"
expect_used = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
panic = "abort"

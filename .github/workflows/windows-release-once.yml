name: Windows Release Build Once

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Signed annotated release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-once-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.14'
  RUST_TOOLCHAIN: '1.92.0'
  CRABCODE_RELEASE_BUILD: '1'
  CRABCODE_BUILD_MINIFY: '1'
  ACCOUNT_BRIDGE_ELIGIBILITY_PUBLIC_KEY_BASE64URL: loXs2jEP4Spq1FRzy0dnU6qm9o6eELAuhJ7AdNw1SVE
  ACCOUNT_BRIDGE_CONNECTOR_POLICY_PUBLIC_KEY_BASE64URL: 1rLNPsLwBefJ_7pKyv-49onlWjUZlGn6TPDnI21QcIg
  ACCOUNT_BRIDGE_ARTIFACT_PUBLIC_KEY_BASE64URL: 15MaLfvECwoagY8Oehclhk5nqsngGq0ECrKkRwOxDAQ
  ACCOUNT_BRIDGE_CONTROL_PLANE_ENDPOINT: https://acosmi.com/api/v4/account-bridge/control-plane/v2

jobs:
  build-windows:
    name: Build Windows release once
    if: github.repository == 'acosmi/CrabCode-TUI'
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RUSTFLAGS: -C link-arg=/Brepro -C link-arg=/DEBUG:NONE
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Verify signed tag and bind release identity
        shell: bash
        env:
          RELEASE_TAG_SIGNER_SSH_ED25519: ${{ vars.RELEASE_TAG_SIGNER_SSH_ED25519 }}
        run: |
          set -euo pipefail
          TAG='${{ inputs.release_tag }}'
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "refs/tags/${TAG}")" = 'tag'
          ALLOWED_SIGNERS="${RUNNER_TEMP}/release-allowed-signers"
          printf 'crabcode-release@acosmi.com %s\n' "${RELEASE_TAG_SIGNER_SSH_ED25519}" > "${ALLOWED_SIGNERS}"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="${ALLOWED_SIGNERS}" verify-tag "${TAG}"
          test "$(git rev-list -n 1 "refs/tags/${TAG}")" = "$(git rev-parse HEAD)"
          VERSION="${TAG#v}"
          test "$(node -p "require('./package.json').version")" = "${VERSION}"
          {
            echo "VERSION=${VERSION}"
            echo "CRABCODE_BUILD_ID=${VERSION}+$(git rev-parse --short=12 HEAD)"
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
          } >> "${GITHUB_ENV}"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            crates
            libs/acosmi-memory

      - name: Install exact JavaScript dependency graph
        run: bun install --frozen-lockfile

      - name: Build closed TypeScript business runtime
        run: bun run build:ts

      - name: Build native Rust TUI product closure
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path crates/Cargo.toml \
            -p crabcode-cli --bin crabcode-pure-tui-launcher
          cargo build --locked --release --manifest-path crates/Cargo.toml \
            -p crabcode-tui --bin crabcode-tui
          cargo build --locked --release --manifest-path crates/Cargo.toml \
            -p crabcode-cron --bin crabcode-cron
          cargo build --locked --release --manifest-path libs/acosmi-memory/Cargo.toml \
            --bin acosmi-memory-orchestrator

      - name: Assemble Windows release package once
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/assemble-release.mjs \
            --platform x64-win32 \
            --version "${VERSION}" \
            --output-dir dist/release
          test -s "dist/release/crabcode-${VERSION}-x64-win32.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-x64-win32
          path: dist/release/crabcode-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Generate Windows build provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/release/crabcode-*.zip
